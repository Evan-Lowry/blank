<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Download the blank assessment pages from a shareable Crowdmark results link.">
<title>Clean Copy · Crowdmark PDF Export</title>
<style>
  :root {
    color-scheme: dark;
    --background: #181818;
    --panel: #202020;
    --field: #181818;
    --border: #373737;
    --text: #f3f3f3;
    --muted: #aaaaaa;
    --accent: #ededed;
    font: 100%/1.5 system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--background); color: var(--text); }
  [hidden] { display: none !important; }

  main {
    width: min(100rem, calc(100% - clamp(2rem, 8vw, 7rem)));
    margin-inline: auto;
    padding-block: clamp(2rem, 9vh, 5.5rem) 3rem;
  }
  h1 {
    margin: 0 0 1.25rem;
    font-size: clamp(1.75rem, 5vw, 2.25rem);
    font-weight: 650;
    letter-spacing: -.04em;
    line-height: 1.15;
    text-wrap: balance;
  }
  .panel {
    padding: clamp(1rem, 4vw, 1.5rem);
    border: 1px solid var(--border);
    background: var(--panel);
  }
  .field-heading {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    column-gap: 1rem;
    row-gap: .25rem;
    margin-bottom: .55rem;
    font-size: .875rem;
  }
  label { font-weight: 650; }
  .help { color: var(--muted); text-decoration-thickness: 1px; text-underline-offset: .19em; }
  .help:hover { color: var(--text); }
  .entry { display: grid; gap: .75rem; }
  textarea {
    width: 100%;
    min-width: 0;
    min-height: 7.5rem;
    resize: vertical;
    padding: .68rem .85rem;
    border: 1px solid #555555;
    border-radius: .5rem;
    background: var(--field);
    color: var(--text);
    font: inherit;
  }
  textarea::placeholder { color: #a1a1a1; }
  button, .download {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-height: 3rem;
    padding: .68rem 1rem;
    border: 1px solid transparent;
    border-radius: .5rem;
    background: var(--accent);
    color: #181818;
    font: inherit;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }
  button:hover, .download:hover { background: #ffffff; }
  button:disabled { opacity: .7; cursor: wait; }
  :focus-visible { outline: 2px solid #c0c0c0; outline-offset: 3px; }

  .status { margin: .85rem 0 0; color: var(--muted); font-size: .875rem; }
  .status:empty { margin: 0; }
  .status.error { color: #ffb2ac; }
  .result { margin-top: .85rem; }
  .result h2 { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
  .result .details { margin: .2rem 0 0; color: var(--muted); font-size: .875rem; }

  .result .details.error { color: #ffb2ac; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .85rem; }
  .secondary {
    background: transparent;
    border-color: #555555;
    color: var(--text);
  }
  .secondary:hover { background: #303030; }
  .pdf-preview {
    width: 100%;
    max-height: 70vh;
    display: grid;
    gap: .65rem;
    overflow: auto;
    padding: .65rem;
    margin-top: 1rem;
    border: 1px solid var(--border);
    border-radius: .25rem;
    background: var(--field);
  }
  .pdf-preview img { width: min(100%, 54rem); height: auto; display: block; margin-inline: auto; background: white; }
  @media (max-width: 30rem) {
    .actions > * { flex: 1; }
  }
</style>
</head>
<body>
<main>
  <h1>Crowdmark to Blank PDF</h1>
  <form class="panel" id="export-form" method="post">
    <div class="field-heading">
      <label for="links">Shareable Crowdmark links</label>
      <a class="help" href="https://www.crowdmark.com/help/sharing-a-graded-assignment-or-test/" target="_blank" rel="noopener noreferrer">Find your link</a>
    </div>
    <div class="entry">
      <textarea id="links" name="links" rows="3" required placeholder="Paste one link per line" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <button type="submit" id="prepare">Prepare PDFs</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </form>
  <div id="results"></div>
</main>
<template id="result-template">
  <section class="panel result">
    <h2></h2>
    <p class="details" role="status"></p>
    <div class="actions" hidden>
      <button type="button" class="secondary" aria-expanded="false" hidden>Preview PDF</button>
      <a class="download">Download PDF</a>
    </div>
    <div class="pdf-preview" role="region" tabindex="0" hidden></div>
  </section>
</template>
<script>
  const form = document.querySelector('#export-form');
  const field = document.querySelector('#links');
  const prepare = document.querySelector('#prepare');
  const status = document.querySelector('#status');
  const results = document.querySelector('#results');
  const template = document.querySelector('#result-template');
  const objectUrls = new Set();

  function objectUrl(blob) {
    const url = URL.createObjectURL(blob);
    objectUrls.add(url);
    return url;
  }

  function wirePreview(button, preview, pdf, ranges, first) {
    if (!ranges.length) return;
    button.hidden = false;
    button.addEventListener('click', () => {
      const show = preview.hidden;
      preview.hidden = !show;
      button.setAttribute('aria-expanded', String(show));
      button.textContent = show ? 'Hide preview' : 'Preview PDF';
      if (!show || preview.childElementCount) return;

      ranges.forEach(([offset, length], index) => {
        const page = document.createElement('img');
        page.loading = index === 0 ? 'eager' : 'lazy';
        page.alt = 'Booklet page ' + (first + index);
        page.src = objectUrl(pdf.slice(offset, offset + length, 'image/jpeg'));
        preview.append(page);
      });
    });
  }

  function addResult(index) {
    const card = template.content.firstElementChild.cloneNode(true);
    const title = card.querySelector('h2');
    const details = card.querySelector('.details');
    const actions = card.querySelector('.actions');
    const preview = card.querySelector('.pdf-preview');
    const previewButton = actions.querySelector('button');
    const download = actions.querySelector('a');

    title.id = 'assessment-' + (index + 1);
    title.textContent = 'Assessment ' + (index + 1);
    card.setAttribute('aria-labelledby', title.id);
    details.textContent = 'Waiting…';
    preview.id = 'preview-' + (index + 1);
    previewButton.setAttribute('aria-controls', preview.id);
    results.append(card);
    return { title, details, actions, preview, previewButton, download };
  }

  async function prepareAssessment(link, row) {
    row.details.textContent = 'Fetching blank pages…';
    try {
      const response = await fetch('/api/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link }),
        signal: AbortSignal.timeout(60000),
      });
      if (!response.ok) {
        const info = await response.json().catch(() => null);
        throw new Error(info?.error || 'The export service could not finish. Try again.');
      }
      if (!response.headers.get('Content-Type')?.startsWith('application/pdf')) {
        throw new Error('The export service returned an unexpected response.');
      }

      const title = decodeURIComponent(response.headers.get('X-Assessment-Title') || 'Crowdmark assessment');
      const first = Number(response.headers.get('X-First-Page'));
      const last = Number(response.headers.get('X-Last-Page'));
      const count = Number(response.headers.get('X-Page-Count'));
      const filename = /filename="([^"]+)"/.exec(response.headers.get('Content-Disposition') || '')?.[1];
      const ranges = JSON.parse(response.headers.get('X-Page-Images') || '[]');
      const pdf = await response.blob();

      row.title.textContent = title;
      row.details.textContent = count + (count === 1 ? ' blank page.' : ' blank pages.') +
        (first > 1 ? ' Crowdmark supplied booklet pages ' + (first === last ? first : first + '–' + last) + '.' : '');
      row.preview.setAttribute('aria-label', title + ' PDF preview');
      if (Array.isArray(ranges)) wirePreview(row.previewButton, row.preview, pdf, ranges, first);
      row.download.href = objectUrl(pdf);
      row.download.download = filename || 'crowdmark-assessment-blank.pdf';
      row.actions.hidden = false;
      return true;
    } catch (error) {
      row.details.classList.add('error');
      row.details.textContent = error.name === 'TimeoutError' ? 'The export timed out. Try again.' : error.message;
      return false;
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (prepare.disabled) return;
    const links = [...new Set(field.value.split(/\s+/).filter(Boolean))];
    status.classList.toggle('error', links.length === 0);
    if (!links.length) {
      status.textContent = 'Paste at least one Crowdmark link.';
      return;
    }

    results.replaceChildren();
    for (const url of objectUrls) URL.revokeObjectURL(url);
    objectUrls.clear();
    const rows = links.map((_, index) => addResult(index));
    prepare.disabled = true;
    prepare.textContent = 'Preparing…';
    status.textContent = '';

    let next = 0;
    let succeeded = 0;
    async function runQueue() {
      while (next < links.length) {
        const index = next++;
        if (await prepareAssessment(links[index], rows[index])) succeeded++;
      }
    }
    await Promise.all(Array.from({ length: Math.min(3, links.length) }, runQueue));

    prepare.disabled = false;
    prepare.textContent = 'Prepare PDFs';
    if (links.length > 1) status.textContent = succeeded + ' of ' + links.length + ' PDFs ready.';
  });

  field.addEventListener('input', () => {
    if (!status.classList.contains('error')) return;
    status.textContent = '';
    status.classList.remove('error');
  });
</script>
</body>
</html>
