<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Download the blank assessment pages from a shareable Crowdmark results link.">
<title>Clean Copy · Crowdmark PDF Export</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f7f7f2;
    --ink: #192a21;
    --muted: #506158;
    --green: #195c43;
    --line: #d8e0d7;
    font: 100%/1.55 system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); }
  .shell { width: min(70rem, calc(100% - 4rem)); margin: auto; }
  .brand { padding-block: 1.65rem; border-bottom: 1px solid var(--line); font-weight: 750; display: flex; align-items: center; gap: .7rem; }
  .mark { display: grid; place-items: center; width: 2rem; height: 2rem; background: var(--green); color: white; border-radius: .45rem; }
  .mark svg { width: 1.1rem; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: stretch; gap: 3rem; padding-block: 4.75rem 3.4rem; }
  .copy { padding-block: 1.1rem; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: clamp(2.7rem, 5.65vw, 5.15rem); line-height: .99; letter-spacing: -.062em; margin: 0; }
  h1 em { font-weight: inherit; color: var(--green); display: block; }
  .lead { max-width: 36ch; font-size: 1.08rem; color: var(--muted); margin-block: 1.5rem 1.9rem; }
  label { display: block; font-size: .875rem; font-weight: 700; margin-bottom: .45rem; }
  .entry { display: flex; gap: .55rem; }
  input { flex: 1; min-width: 0; border: 1px solid #97ab9d; border-radius: .5rem; background: #fff; color: var(--ink); font: inherit; padding: .78rem .85rem; }
  input::placeholder { color: #64756b; }
  button, .download { display: inline-flex; justify-content: center; align-items: center; gap: .45rem; border: 1px solid transparent; border-radius: .5rem; background: var(--green); color: white; padding: .75rem 1rem; min-height: 2.9rem; font: inherit; font-weight: 650; cursor: pointer; text-decoration: none; white-space: nowrap; }
  button:hover, .download:hover { background: #104b35; }
  button:disabled { cursor: wait; opacity: .7; }
  :focus-visible { outline: 3px solid #498c69; outline-offset: 3px; }
  .hint { color: var(--muted); font-size: .875rem; margin-block: .58rem 0; }
  .hint a { color: inherit; text-underline-offset: .16em; }
  .status:empty { display: none; }
  .status { margin: 1rem 0 0; font-size: .95rem; }
  .status.error { color: #8a2521; }
  .result { margin-top: 1.25rem; background: #e9f2e9; border: 1px solid #bbd0bf; border-radius: .65rem; padding: 1rem; }
  .result[hidden] { display: none; }
  .result h2 { font-size: 1.12rem; line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
  .result p { color: var(--muted); margin: .4rem 0 .8rem; }
  .art { position: relative; display: grid; place-items: center; min-height: 24rem; overflow: hidden; border-radius: 1.05rem; background: #dce9dc; }
  .art::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(#52776147 1px, transparent 1px); background-size: 16px 16px; mask-image: linear-gradient(160deg, black, transparent 86%); }
  .stack { position: relative; width: min(48%, 12.5rem); aspect-ratio: 3 / 4; margin-top: .6rem; }
  .sheet { position: absolute; inset: 0; border: 1px solid #91ae9a; border-radius: .28rem; background: #fefef9; box-shadow: 0 10px 24px #19392622; }
  .sheet.back { transform: rotate(-13deg) translate(-14%, -2%); background: #b6d0ba; }
  .sheet.middle { transform: rotate(13deg) translate(13%, -1%); background: #edf5ea; }
  .sheet.front { display: flex; flex-direction: column; gap: 5%; padding: 15% 13%; transform: rotate(-3deg); }
  .rule { height: 2.1%; border-radius: 1rem; background: #c0d1c1; }
  .rule.title { width: 70%; height: 4%; background: #28694c; margin-bottom: 9%; }
  .rule.short { width: 60%; }
  .answer { height: 22%; border: 1px solid #ccd8cc; border-radius: .2rem; margin-block: 3% 5%; }
  .foot { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding-block: 1.25rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .875rem; }
  @media (max-width: 54rem) { .layout { gap: 1.75rem; } .entry { flex-wrap: wrap; } .entry input { flex-basis: 100%; } }
  @media (max-width: 42rem) {
    .shell { width: calc(100% - 2rem); }
    .layout { grid-template-columns: 1fr; gap: 1.5rem; padding-block: 2rem; }
    .lead { margin-block: 1.15rem 1.5rem; }
    .art { min-height: 17rem; }
    .stack { width: 8.5rem; }
    .foot { display: block; }
  }
  @media (prefers-reduced-motion: no-preference) { button, .download { transition: background-color .15s; } }
</style>
</head>
<body>
<header class="shell brand">
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 13h6M9 16.5h6"/></svg>
  </span>
  Clean Copy
</header>
<main class="shell layout">
  <section class="copy" aria-labelledby="title">
    <h1 id="title">Your assessment, <em>blank again.</em></h1>
    <p class="lead">Turn a Crowdmark results link into a practice PDF with the original questions and blank answer spaces.</p>
    <form id="export-form">
      <label for="link">Crowdmark results link</label>
      <div class="entry">
        <input type="url" id="link" name="link" required placeholder="https://app.crowdmark.com/score/…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="link-hint" maxlength="2048">
        <button type="submit" id="prepare">Prepare PDF</button>
      </div>
      <p class="hint" id="link-hint">In Crowdmark, choose <a href="https://www.crowdmark.com/help/sharing-a-graded-assignment-or-test/" target="_blank" rel="noopener noreferrer">Get shareable link</a> on the results page.</p>
    </form>
    <p class="status" id="status" role="status"></p>
    <section class="result" id="result" hidden aria-labelledby="result-title">
      <h2 id="result-title"></h2>
      <p id="result-details"></p>
      <a class="download" id="download">Download PDF</a>
    </section>
  </section>
  <div class="art" aria-hidden="true">
    <div class="stack">
      <div class="sheet back"></div>
      <div class="sheet middle"></div>
      <div class="sheet front">
        <span class="rule title"></span>
        <span class="rule"></span>
        <span class="rule short"></span>
        <span class="answer"></span>
        <span class="rule"></span>
        <span class="rule short"></span>
        <span class="answer"></span>
      </div>
    </div>
  </div>
</main>
<footer class="shell foot">
  <span>Exports blank booklet pages supplied by Crowdmark.</span>
</footer>
<script>
  const form = document.querySelector('#export-form');
  const field = document.querySelector('#link');
  const prepare = document.querySelector('#prepare');
  const status = document.querySelector('#status');
  const result = document.querySelector('#result');
  const download = document.querySelector('#download');
  let currentUrl;

  function clearResult() {
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = undefined;
    download.removeAttribute('href');
    result.hidden = true;
    status.textContent = '';
    status.classList.remove('error');
  }

  field.addEventListener('input', clearResult);

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearResult();
    prepare.disabled = true;
    field.readOnly = true;
    prepare.textContent = 'Preparing…';
    form.setAttribute('aria-busy', 'true');
    status.textContent = 'Looking for the original blank pages…';
    try {
      const response = await fetch('/api/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link: field.value }),
        signal: AbortSignal.timeout(60000),
      });
      if (!response.ok) {
        const info = await response.json().catch(() => null);
        throw new Error(info?.error || 'The export service could not finish. Try again.');
      }
      if (!response.headers.get('Content-Type')?.startsWith('application/pdf')) {
        throw new Error('The export service returned an unexpected response.');
      }
      const title = decodeURIComponent(response.headers.get('X-Assessment-Title') || 'Crowdmark assessment');
      const first = Number(response.headers.get('X-First-Page'));
      const last = Number(response.headers.get('X-Last-Page'));
      const count = Number(response.headers.get('X-Page-Count'));
      const filename = /filename="([^"]+)"/.exec(response.headers.get('Content-Disposition') || '')?.[1];
      currentUrl = URL.createObjectURL(await response.blob());
      download.href = currentUrl;
      download.download = filename || 'crowdmark-assessment-blank.pdf';
      document.querySelector('#result-title').textContent = title;
      document.querySelector('#result-details').textContent = count + (count === 1 ? ' blank page.' : ' blank pages.') +
        (first > 1 ? ' Crowdmark supplied booklet pages ' + (first === last ? first : first + '–' + last) + '.' : '');
      result.hidden = false;
      status.textContent = 'Your PDF is ready.';
    } catch (error) {
      status.classList.add('error');
      status.textContent = error.name === 'TimeoutError' ? 'The export timed out. Try again.' : error.message;
    } finally {
      prepare.disabled = false;
      field.readOnly = false;
      prepare.textContent = 'Prepare PDF';
      form.removeAttribute('aria-busy');
    }
  });
</script>
</body>
</html>
