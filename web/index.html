<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Download the blank assessment pages from a shareable Crowdmark results link.">
<title>Clean Copy · Crowdmark PDF Export</title>
<style>
  :root {
    color-scheme: dark;
    --background: #181818;
    --panel: #202020;
    --field: #181818;
    --border: #373737;
    --text: #f3f3f3;
    --muted: #aaaaaa;
    --accent: #ededed;
    font: 100%/1.5 system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--background); color: var(--text); }
  [hidden] { display: none !important; }

  main {
    width: min(33rem, calc(100% - 2rem));
    margin-inline: auto;
    padding-block: clamp(3rem, 15vh, 8rem) 3rem;
  }
  h1 {
    margin: 0 0 1.25rem;
    font-size: clamp(1.75rem, 5vw, 2.25rem);
    font-weight: 650;
    letter-spacing: -.04em;
    line-height: 1.15;
    text-wrap: balance;
  }
  .panel {
    padding: clamp(1rem, 4vw, 1.5rem);
    border: 1px solid var(--border);
    border-radius: .5rem;
    background: var(--panel);
  }
  .field-heading {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    column-gap: 1rem;
    row-gap: .25rem;
    margin-bottom: .55rem;
    font-size: .875rem;
  }
  label { font-weight: 650; }
  .help { color: var(--muted); text-decoration-thickness: 1px; text-underline-offset: .19em; }
  .help:hover { color: var(--text); }
  .entry { display: grid; gap: .75rem; }
  input {
    width: 100%;
    min-width: 0;
    min-height: 3rem;
    padding: .68rem .85rem;
    border: 1px solid #555555;
    border-radius: .5rem;
    background: var(--field);
    color: var(--text);
    font: inherit;
  }
  input::placeholder { color: #a1a1a1; }
  button, .download {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-height: 3rem;
    padding: .68rem 1rem;
    border: 1px solid transparent;
    border-radius: .5rem;
    background: var(--accent);
    color: #181818;
    font: inherit;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }
  button:hover, .download:hover { background: #ffffff; }
  button:disabled { opacity: .7; cursor: wait; }
  :focus-visible { outline: 2px solid #c0c0c0; outline-offset: 3px; }

  .status { margin: .85rem 0 0; color: var(--muted); font-size: .875rem; }
  .status:empty { margin: 0; }
  .status.error { color: #ffb2ac; }
  .status.ready {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .result { margin-top: .85rem; }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }
  .result h2 { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
  .result p { margin: .2rem 0 0; color: var(--muted); font-size: .875rem; }

  .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
  .secondary {
    background: transparent;
    border-color: #555555;
    color: var(--text);
  }
  .secondary:hover { background: #303030; }
  .pdf-preview {
    width: 100%;
    height: clamp(22rem, 70vh, 48rem);
    display: block;
    margin-top: 1rem;
    border: 1px solid var(--border);
    border-radius: .25rem;
    background: var(--field);
  }
  @media (max-width: 38rem) {
    .result-row { flex-direction: column; align-items: stretch; }
    .actions > * { flex: 1; }
  }
</style>
</head>
<body>
<main>
  <h1>Crowdmark to Blank PDF</h1>
  <div class="panel">
    <form id="export-form" method="post">
      <div class="field-heading">
        <label for="link">Shareable Crowdmark link</label>
        <a class="help" href="https://www.crowdmark.com/help/sharing-a-graded-assignment-or-test/" target="_blank" rel="noopener noreferrer">Find your link</a>
      </div>
      <div class="entry">
        <input type="url" id="link" name="link" required placeholder="https://app.crowdmark.com/score/…" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="2048">
        <button type="submit" id="prepare">Prepare PDF</button>
      </div>
    </form>
    <p class="status" id="status" role="status"></p>
  </div>
  <section class="panel result" id="result" hidden aria-labelledby="result-title">
    <div class="result-row">
      <div>
        <h2 id="result-title"></h2>
        <p id="result-details"></p>
      </div>
      <div class="actions">
        <button type="button" class="secondary" id="preview-toggle" aria-expanded="false" aria-controls="pdf-preview">Preview PDF</button>
        <a class="download" id="download">Download PDF</a>
      </div>
    </div>
    <iframe class="pdf-preview" id="pdf-preview" title="Blank assessment PDF preview" hidden></iframe>
  </section>
</main>
<script>
  const form = document.querySelector('#export-form');
  const field = document.querySelector('#link');
  const prepare = document.querySelector('#prepare');
  const status = document.querySelector('#status');
  const result = document.querySelector('#result');
  const download = document.querySelector('#download');
  const previewToggle = document.querySelector('#preview-toggle');
  const pdfPreview = document.querySelector('#pdf-preview');
  let currentUrl;

  function showPreview(show) {
    pdfPreview.hidden = !show;
    previewToggle.setAttribute('aria-expanded', String(show));
    previewToggle.textContent = show ? 'Hide preview' : 'Preview PDF';
    if (show) pdfPreview.src = currentUrl;
    else pdfPreview.removeAttribute('src');
  }

  previewToggle.addEventListener('click', () => showPreview(pdfPreview.hidden));

  function clearResult() {
    showPreview(false);
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = undefined;
    download.removeAttribute('href');
    result.hidden = true;
    status.textContent = '';
    status.classList.remove('error', 'ready');
  }

  field.addEventListener('input', clearResult);

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearResult();
    prepare.disabled = true;
    field.readOnly = true;
    prepare.textContent = 'Preparing…';
    form.setAttribute('aria-busy', 'true');
    status.textContent = 'Fetching blank pages…';
    try {
      const response = await fetch('/api/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link: field.value }),
        signal: AbortSignal.timeout(60000),
      });
      if (!response.ok) {
        const info = await response.json().catch(() => null);
        throw new Error(info?.error || 'The export service could not finish. Try again.');
      }
      if (!response.headers.get('Content-Type')?.startsWith('application/pdf')) {
        throw new Error('The export service returned an unexpected response.');
      }
      const title = decodeURIComponent(response.headers.get('X-Assessment-Title') || 'Crowdmark assessment');
      const first = Number(response.headers.get('X-First-Page'));
      const last = Number(response.headers.get('X-Last-Page'));
      const count = Number(response.headers.get('X-Page-Count'));
      const filename = /filename="([^"]+)"/.exec(response.headers.get('Content-Disposition') || '')?.[1];
      currentUrl = URL.createObjectURL(await response.blob());
      download.href = currentUrl;
      download.download = filename || 'crowdmark-assessment-blank.pdf';
      document.querySelector('#result-title').textContent = title;
      document.querySelector('#result-details').textContent = count + (count === 1 ? ' blank page.' : ' blank pages.') +
        (first > 1 ? ' Crowdmark supplied booklet pages ' + (first === last ? first : first + '–' + last) + '.' : '');
      result.hidden = false;
      status.classList.add('ready');
      status.textContent = 'PDF ready to download.';
    } catch (error) {
      status.classList.add('error');
      status.textContent = error.name === 'TimeoutError' ? 'The export timed out. Try again.' : error.message;
    } finally {
      prepare.disabled = false;
      field.readOnly = false;
      prepare.textContent = 'Prepare PDF';
      form.removeAttribute('aria-busy');
    }
  });
</script>
</body>
</html>
