<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Download the blank assessment pages from a shareable Crowdmark results link.">
<title>Clean Copy · Crowdmark PDF Export</title>
<style>
  :root {
    color-scheme: dark;
    --background: #181818;
    --panel: #202020;
    --field: #181818;
    --border: #373737;
    --text: #f3f3f3;
    --muted: #aaaaaa;
    --accent: #ededed;
    font: 100%/1.5 system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--background); color: var(--text); }
  [hidden] { display: none !important; }

  main {
    width: min(100rem, calc(100% - clamp(2rem, 8vw, 7rem)));
    margin-inline: auto;
    padding-block: clamp(2rem, 9vh, 5.5rem) 3rem;
  }
  .workspace { width: min(100%, 38rem); margin-inline: auto; }
  .workspace.split {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(18rem, 2fr) minmax(0, 3fr);
    align-items: start;
    gap: clamp(1rem, 3vw, 2.5rem);
  }
  h1 {
    margin: 0 0 1.25rem;
    font-size: clamp(1.75rem, 5vw, 2.25rem);
    font-weight: 650;
    letter-spacing: -.04em;
    line-height: 1.15;
    text-wrap: balance;
  }
  .panel {
    padding: clamp(1rem, 4vw, 1.5rem);
    border: 1px solid var(--border);
    background: var(--panel);
  }
  .field-heading {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    column-gap: 1rem;
    row-gap: .25rem;
    margin-bottom: .55rem;
    font-size: .875rem;
  }
  #links-label { font-weight: 650; }
  .help { color: var(--muted); text-decoration-thickness: 1px; text-underline-offset: .19em; }
  .help:hover { color: var(--text); }
  .entry, .links { display: grid; gap: .65rem; }
  .link-row { display: flex; gap: .5rem; }
  .link-row input { flex: 1; }
  .form-buttons { display: flex; flex-wrap: wrap; gap: .65rem; }
  #prepare { flex: 1; }
  input {
    width: 100%;
    min-width: 0;
    min-height: 3rem;
    padding: .68rem .85rem;
    border: 1px solid #555555;
    border-radius: .5rem;
    background: var(--field);
    color: var(--text);
    font: inherit;
  }
  input::placeholder { color: #a1a1a1; }
  button, .download {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-height: 3rem;
    padding: .68rem 1rem;
    border: 1px solid transparent;
    border-radius: .5rem;
    background: var(--accent);
    color: #181818;
    font: inherit;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }
  button:hover, .download:hover { background: #ffffff; }
  button:disabled { opacity: .7; cursor: wait; }
  :focus-visible { outline: 2px solid #c0c0c0; outline-offset: 3px; }

  .status { margin: .85rem 0 0; color: var(--muted); font-size: .875rem; }
  .status:empty { margin: 0; }
  .status.error { color: #ffb2ac; }
  .result { margin-top: .85rem; }
  .result h2 { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
  .result .details { margin: .2rem 0 0; color: var(--muted); font-size: .875rem; }

  .result .details.error { color: #ffb2ac; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .85rem; }
  .secondary {
    background: transparent;
    border-color: #555555;
    color: var(--text);
  }
  .secondary:hover { background: #303030; }
  .viewer {
    position: sticky;
    top: 1rem;
  }
  .viewer-toolbar { display:flex; justify-content:flex-end; gap:.5rem; margin-bottom:.65rem; }
  .viewer-toolbar a, .viewer-toolbar button { min-height:2.5rem; font-size:.875rem; padding:.4rem .75rem; }
  .viewer-frame { width:100%; height:70vh; display:block; border:1px solid var(--border); background:var(--field); }
  .viewer-message { margin:.25rem 0; color:var(--muted); }
  .preview-selected { background:#282828; }
  .bank-entry.preview-selected { box-shadow: -3px 0 var(--accent); }
  .course-matches { display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.55rem; }
  .course-matches a { color:var(--text); font-size:.875rem; padding:.25rem .45rem; border:1px solid var(--border); }
  .duplicate-notice { border:1px solid #555; padding:.65rem; font-size:.875rem; }
  .duplicate-notice a { color:var(--text); }
  .duplicate-notice ul { margin:.25rem 0; padding-left:1.25rem; }
  .retry-form { display:flex; flex-wrap:wrap; gap:.55rem; margin-top:.6rem; }
  .retry-form input { flex:1; min-width:12rem; }
  .site-nav {
    width: min(100%, 38rem);
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
    margin: 0 auto 1.35rem;
    border-bottom: 1px solid var(--border);
  }
  .site-nav:has(+ .split) { width: 100%; }
  .site-nav a { color: var(--muted); text-decoration: none; padding: .45rem .1rem; }
  .site-nav a[aria-current] { color: var(--text); box-shadow: inset 0 -2px var(--accent); }
  .bank-filters, .contribution-fields { display: grid; gap: .6rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bank-filters > :first-child { grid-column: 1 / -1; }
  .form-field { display: grid; gap: .3rem; font-size: .875rem; }
  .form-field input:not([type=checkbox]), .form-field select { width: 100%; min-width: 0; }
  select { background: var(--field); color: var(--text); padding: .65rem; border: 1px solid #555; border-radius: .5rem; font: inherit; }
  .bank-status, .file-status { color: var(--muted); font-size: .875rem; }
  .bank-status:empty, .file-status:empty { display: none; }
  .bank-list { margin-top: .85rem; }
  .bank-entry { padding-block: .95rem; border-bottom: 1px solid var(--border); }
  .bank-entry:last-child { border-bottom: 0; padding-bottom: 0; }
  .bank-entry h3, .course-title { margin: 0; font-size: 1rem; }
  .course-title { margin-top: 1rem; color: var(--muted); }
  .course-title a { color: inherit; }
  .exam-detail { margin: .15rem 0 0; color: var(--muted); font-size: .875rem; }
  .bank-actions { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.7rem; }
  .bank-actions button, .bank-actions a { min-height:2.5rem; padding:.38rem .72rem; font-size:.875rem; }
  .bank-signin { color: var(--text); }
  dialog { width:min(34rem, calc(100% - 2rem)); padding:1.25rem; color:var(--text); background:var(--panel); border:1px solid #555; }
  dialog::backdrop { background:#000a; }
  dialog h2 { margin:0 0 .8rem; font-size:1.2rem; }
  .contribution-form { display:grid; gap:.9rem; }
  .contribution-form input[type=file] { padding:.45rem; }
  .check-row { display:flex; align-items:flex-start; gap:.45rem; font-size:.875rem; }
  .check-row input { margin-top:.25rem; width:auto; min-height:0; padding:0; }
  .review-confirmation { margin-top:.65rem; }
  @media (max-width: 28rem) { .bank-filters, .contribution-fields { grid-template-columns:1fr; } }
  @media (max-width: 50rem) {
    .workspace.split { display: grid; width: min(100%, 38rem); grid-template-columns: minmax(0, 1fr); }
    .viewer { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; background:var(--background); }
    .viewer-toolbar { justify-content:space-between; }
    .viewer-frame { min-height:0; height:auto; flex:1; }
    body.pdf-open { overflow:hidden; }
  }
  @media (max-width: 30rem) {
    .actions > * { flex: 1; }
  }
</style>
</head>
<body>
<main>
<nav class="site-nav" aria-label="Clean Copy">
  <a href="#converter" aria-current="page">Converter</a>
  <a href="#exam-bank">Exam bank</a>
</nav>
<div class="workspace" id="workspace">
  <div>
  <section id="converter-view" aria-labelledby="converter-heading">
    <h1 id="converter-heading">Crowdmark to Blank PDF</h1>
    <form class="panel" id="export-form" method="post" novalidate>
      <div class="field-heading">
        <span id="links-label">Shareable Crowdmark links</span>
        <a class="help" href="https://www.crowdmark.com/help/sharing-a-graded-assignment-or-test/" target="_blank" rel="noopener noreferrer">Find your link</a>
      </div>
      <div class="entry">
        <div class="links" id="links" role="group" aria-labelledby="links-label"></div>
        <div class="form-buttons">
          <button type="button" class="secondary" id="add-link">Add another link</button>
          <button type="submit" id="prepare">Prepare PDFs</button>
        </div>
      </div>
      <p class="status" id="status" role="status"></p>
    </form>
    <div id="results"></div>
  </section>
  <section id="bank-view" hidden aria-labelledby="bank-heading">
    <h1 id="bank-heading">Waterloo Exam Bank</h1>
    <div class="panel">
      <div id="bank-filters" class="bank-filters">
        <label class="form-field">Course code
          <input id="bank-course" type="search" placeholder="STAT 230" maxlength="24" autocomplete="off">
        </label>
        <label class="form-field">Term
          <select id="bank-term"><option value="">All terms</option></select>
        </label>
        <label class="form-field">Assessment type
          <select id="bank-assessment"><option value="">All types</option><option>Midterm</option><option>Final</option><option>Quiz</option><option>Test</option><option>Other</option></select>
        </label>
      </div>
      <div class="course-matches" id="course-matches" aria-label="Matching courses" hidden></div>
      <div class="bank-actions">
        <button id="bank-upload" type="button">Contribute a PDF</button>
        <button class="secondary" id="bank-review" type="button">Review submissions</button>
      </div>
    </div>
    <p class="bank-status" id="bank-status" role="status"></p>
    <a class="bank-signin" id="bank-signin" href="/signin-with-chatgpt?return_to=%2F%23review" target="_top" hidden>Sign in as an editor</a>
    <div class="bank-list" id="bank-list"></div>
  </section>
  </div>
  <section class="panel viewer" id="viewer" aria-label="PDF preview" hidden>
    <div class="viewer-toolbar">
      <button class="secondary" type="button" id="preview-back">Back</button>
      <a class="download secondary" id="preview-open" target="_blank" rel="noopener noreferrer">Open PDF in new tab</a>
    </div>
    <p class="viewer-message" id="viewer-message" hidden>This browser does not display PDFs inside the page.</p>
    <iframe id="viewer-frame" class="viewer-frame" title="PDF preview"></iframe>
  </section>
</div>
</main>
<dialog id="contribution" aria-labelledby="contribution-heading">
  <h2 id="contribution-heading">Contribute to the exam bank</h2>
  <form class="contribution-form" id="contribution-form">
    <label class="form-field" id="upload-field">Blank PDF
      <input id="contribution-file" type="file" accept="application/pdf,.pdf">
    </label>
    <div class="contribution-fields">
      <label class="form-field">Course code
        <input name="course" placeholder="STAT 230" maxlength="16" required>
      </label>
      <label class="form-field">Year
        <input name="year" type="number" min="1900" max="2099" placeholder="2025" required>
      </label>
      <label class="form-field">Term
        <select name="season" required><option value="">Choose a term</option><option value="W">Winter</option><option value="S">Spring</option><option value="F">Fall</option></select>
      </label>
      <label class="form-field">Assessment type
        <select name="assessment" required><option value="">Choose a type</option><option>Midterm</option><option>Final</option><option>Quiz</option><option>Test</option><option>Other</option></select>
      </label>
      <label class="form-field">Assessment number (optional)
        <input name="assessmentNumber" type="number" min="1" max="99" placeholder="2">
      </label>
    </div>
    <div class="duplicate-notice" id="duplicate-notice" hidden>
      <strong>Similar exams already in the bank</strong>
      <ul id="duplicate-list"></ul>
      <label class="check-row"><input type="checkbox" id="duplicate-confirm"> This copy is a different version or a clearer scan.</label>
    </div>
    <p class="file-status" id="contribution-status" role="status"></p>
    <label class="check-row"><input name="blankConfirmed" type="checkbox" required> <span id="contribution-attestation">I checked that every page is blank and I have permission to share this exam.</span></label>
    <div class="bank-actions">
      <button class="secondary" type="button" id="contribution-cancel">Cancel</button>
      <button type="submit" id="contribution-submit">Submit for review</button>
    </div>
  </form>
</dialog>
<template id="link-template">
  <div class="link-row">
    <input type="url" name="link" placeholder="https://app.crowdmark.com/score/…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="button" class="secondary" hidden>Remove</button>
  </div>
</template>
<template id="result-template">
  <section class="panel result">
    <h2></h2>
    <p class="details" role="status"></p>
    <div class="retry-form" hidden>
      <input type="url" aria-label="Crowdmark link to retry" placeholder="Correct the Crowdmark link">
      <button type="button" class="secondary">Retry</button>
    </div>
    <div class="actions" hidden>
      <button type="button" class="secondary" aria-expanded="false" aria-controls="viewer" hidden>Preview PDF</button>
      <a class="download" hidden>Download PDF</a>
      <button type="button" class="secondary contribute" hidden>Contribute to the exam bank</button>
    </div>
  </section>
</template>
<script>
  const form = document.querySelector('#export-form');
  const fields = document.querySelector('#links');
  const linkTemplate = document.querySelector('#link-template');
  const addLink = document.querySelector('#add-link');
  const prepare = document.querySelector('#prepare');
  const status = document.querySelector('#status');
  const results = document.querySelector('#results');
  const template = document.querySelector('#result-template');
  const workspace = document.querySelector('#workspace');
  const viewer = document.querySelector('#viewer');
  const viewerFrame = document.querySelector('#viewer-frame');
  const previewOpen = document.querySelector('#preview-open');
  const previewBack = document.querySelector('#preview-back');
  const viewerMessage = document.querySelector('#viewer-message');
  const objectUrls = new Set();
  let activePreview;
  let previewScroll;

  function updateLinkLabels() {
    [...fields.children].forEach((row, index) => {
      row.querySelector('input').setAttribute('aria-label', 'Crowdmark link ' + (index + 1));
      const remove = row.querySelector('button');
      remove.setAttribute('aria-label', 'Remove link ' + (index + 1));
      remove.hidden = fields.childElementCount === 1;
    });
  }

  function addField(value = '', after) {
    const row = linkTemplate.content.firstElementChild.cloneNode(true);
    const input = row.querySelector('input');
    input.value = value;
    row.querySelector('button').addEventListener('click', () => {
      const next = row.nextElementSibling || row.previousElementSibling;
      row.remove();
      updateLinkLabels();
      next.querySelector('input').focus();
    });
    input.addEventListener('paste', (event) => {
      const pasted = event.clipboardData.getData('text').trim().split(/\s+/).filter(Boolean);
      if (pasted.length < 2) return;
      event.preventDefault();
      input.value = pasted[0];
      let previous = row;
      for (const link of pasted.slice(1)) previous = addField(link, previous);
      previous.querySelector('input').focus();
      status.textContent = '';
    });
    if (after) after.after(row);
    else fields.append(row);
    updateLinkLabels();
    return row;
  }

  addField();
  addLink.addEventListener('click', () => addField().querySelector('input').focus());

  function objectUrl(blob) {
    const url = URL.createObjectURL(blob);
    objectUrls.add(url);
    return url;
  }

  function hidePreview(restorePosition = false) {
    if (!activePreview) return;
    const button = activePreview;
    activePreview = undefined;
    button.setAttribute('aria-expanded', 'false');
    button.textContent = 'Preview PDF';
    button.closest('article, section')?.classList.remove('preview-selected');
    viewer.hidden = true;
    viewerFrame.removeAttribute('src');
    previewOpen.removeAttribute('href');
    workspace.classList.remove('split');
    document.body.classList.remove('pdf-open');
    if (restorePosition) {
      button.focus({ preventScroll: true });
      window.scrollTo(0, previewScroll);
    }
  }

  previewBack.addEventListener('click', () => hidePreview(true));
  viewer.addEventListener('keydown', event => {
    if (event.key === 'Escape') hidePreview(true);
  });

  function showPdf(button, url) {
    if (button === activePreview) {
      hidePreview(true);
      return;
    }
    if (!activePreview) previewScroll = window.scrollY;
    hidePreview();
    activePreview = button;
    button.setAttribute('aria-expanded', 'true');
    button.textContent = 'Hide preview';
    const row = button.closest('article, section');
    row?.classList.add('preview-selected');
    previewOpen.href = url;
    const embedsPdfs = navigator.pdfViewerEnabled !== false && !/CodexBrowser\b/i.test(navigator.userAgent);
    viewerFrame.hidden = !embedsPdfs;
    viewerMessage.hidden = embedsPdfs;
    if (embedsPdfs) viewerFrame.src = url;
    viewer.hidden = false;
    workspace.classList.add('split');
    document.body.classList.add('pdf-open');
    if (matchMedia('(max-width: 50rem)').matches) previewBack.focus({ preventScroll: true });
    else row?.scrollIntoView({ block: 'nearest' });
  }

  function addResult(index, link) {
    const card = template.content.firstElementChild.cloneNode(true);
    const title = card.querySelector('h2');
    const details = card.querySelector('.details');
    const actions = card.querySelector('.actions');
    const previewButton = actions.querySelector('button');
    const download = actions.querySelector('a');
    const contribute = actions.querySelector('.contribute');
    const retryGroup = card.querySelector('.retry-form');
    const retryLink = retryGroup.querySelector('input');
    const retry = retryGroup.querySelector('button');
    const originalField = [...fields.querySelectorAll('input')].find(input => input.value.trim() === link);
    retryLink.value = link;
    retryLink.setAttribute('aria-label', 'Crowdmark link for assessment ' + (index + 1));

    title.id = 'assessment-' + (index + 1);
    title.textContent = 'Assessment ' + (index + 1);
    card.setAttribute('aria-labelledby', title.id);
    details.textContent = 'Waiting…';
    results.append(card);
    const row = { card, title, details, actions, previewButton, download, contribute, retryGroup, retry };
    retry.addEventListener('click', async () => {
      const corrected = retryLink.value.trim();
      if (await prepareAssessment(corrected, row)) {
        if (originalField?.value.trim() === link) originalField.value = corrected;
        summarizeBatch();
      }
    });
    retryLink.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        retry.click();
      }
    });
    return row;
  }

  async function getBlankReferences(link) {
    try {
      const url = new URL(link);
      const score = /^\/score\/([a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12})\/?$/i.exec(url.pathname);
      if (url.origin !== 'https://app.crowdmark.com' || url.username || url.password || !score) return;
      const id = score[1].toLowerCase();
      const response = await fetch(url.origin + '/api/v1/student/results/' + id, {
        headers: { Accept: 'application/json' },
        credentials: 'omit',
        redirect: 'error',
        cache: 'no-store',
        signal: AbortSignal.timeout(12000),
      });
      if (!response.ok) return;

      const { data, included } = await response.json();
      if (data?.id !== id || !Array.isArray(included)) return;
      const masterRef = data.relationships?.['exam-master']?.data;
      const master = included.find(item => item.type === 'exam-masters' && item.id === masterRef?.id);
      const pageRefs = master?.relationships?.['exam-master-pages']?.data;
      if (!master || !Array.isArray(pageRefs)) return;
      const pageIds = new Set(pageRefs.map(page => page.id));
      const pages = included.filter(item => item.type === 'exam-master-pages' && pageIds.has(item.id))
        .map(({ id, type, attributes }) => {
          const { number, url } = (Array.isArray(attributes) ? attributes[0] : attributes) || {};
          return { id, type, attributes: { number, url } };
        });

      return {
        data: { id, relationships: { 'exam-master': { data: masterRef } } },
        included: [{
          id: master.id,
          type: master.type,
          attributes: { title: master.attributes?.title },
          relationships: { 'exam-master-pages': { data: pageRefs } },
        }, ...pages],
      };
    } catch {
      // The server can also retrieve the public results response.
    }
  }

  async function requestExport(link, contribution) {
    const template = await getBlankReferences(link);
    const response = await fetch('/api/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ link, template, prepare: !contribution, contribution }),
      signal: AbortSignal.timeout(60000),
    });
    if (!response.ok) {
      const info = await response.json().catch(() => null);
      throw new Error(info?.error || 'The export service could not finish. Try again.');
    }
    return response;
  }

  async function unlockConverterExport(link, row, contribution) {
    const response = await requestExport(link, contribution);
    if (!response.headers.get('Content-Type')?.startsWith('application/pdf')) {
      throw new Error('The export service returned an unexpected response.');
    }
    const filename = /filename="([^"]+)"/.exec(response.headers.get('Content-Disposition') || '')?.[1];
    const pdf = await response.blob();
    if (!row.card.isConnected) return;
    const url = objectUrl(pdf);
    row.previewButton.hidden = false;
    row.previewButton.addEventListener('click', () => showPdf(row.previewButton, url));
    row.download.href = url;
    row.download.download = filename || 'crowdmark-assessment-blank.pdf';
    row.download.hidden = false;
    row.contribute.hidden = true;
    row.details.textContent = row.summary;
  }

  async function prepareAssessment(link, row) {
    row.retry.disabled = true;
    row.details.classList.remove('error');
    row.details.textContent = 'Finding blank pages…';
    try {
      const { title, first, last, count } = await (await requestExport(link)).json();
      if (!row.card.isConnected) return false;
      row.title.textContent = title;
      row.summary = count + (count === 1 ? ' blank page.' : ' blank pages.') +
        (first > 1 ? ' Crowdmark supplied booklet pages ' + (first === last ? first : first + '–' + last) + '.' : '');
      row.details.textContent = row.summary + ' Contribute to unlock the PDF.';
      row.contribute.hidden = false;
      row.contribute.addEventListener('click', () => openContribution({
        title,
        submit: details => unlockConverterExport(link, row, details),
      }));
      row.retryGroup.hidden = true;
      row.actions.hidden = false;
      return true;
    } catch (error) {
      row.details.classList.add('error');
      row.retryGroup.hidden = false;
      row.details.textContent = error.name === 'TimeoutError' ? 'The request timed out. Try again.' : error.message;
      return false;
    } finally {
      row.retry.disabled = false;
    }
  }

  function summarizeBatch() {
    if (prepare.disabled || results.childElementCount < 2) return;
    const total = results.childElementCount;
    const found = results.querySelectorAll('.actions:not([hidden])').length;
    status.textContent = found + ' of ' + total + ' assessments found.';
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (prepare.disabled) return;
    const values = [...fields.querySelectorAll('input')].map(input => input.value.trim()).filter(Boolean);
    const links = [...new Set(values)];
    status.classList.toggle('error', links.length === 0);
    if (!links.length) {
      status.textContent = 'Paste at least one Crowdmark link.';
      return;
    }

    hidePreview();
    results.replaceChildren();
    for (const url of objectUrls) URL.revokeObjectURL(url);
    objectUrls.clear();
    const rows = links.map((link, index) => addResult(index, link));
    prepare.disabled = true;
    prepare.textContent = 'Preparing…';
    status.textContent = '';

    let next = 0;
    async function runQueue() {
      while (next < links.length) {
        const index = next++;
        await prepareAssessment(links[index], rows[index]);
      }
    }
    await Promise.all(Array.from({ length: Math.min(3, links.length) }, runQueue));

    prepare.disabled = false;
    prepare.textContent = 'Prepare PDFs';
    summarizeBatch();
  });

  fields.addEventListener('input', () => {
    if (!status.classList.contains('error')) return;
    status.textContent = '';
    status.classList.remove('error');
  });
</script>
<!-- exam-bank-script -->
</body>
</html>
